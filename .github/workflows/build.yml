name: Build KPM & Daemon
on: [push, workflow_dispatch]

jobs:
  build-all:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone KernelPatch Headers
        run: |
          git clone --recursive https://github.com/bmax121/KernelPatch.git
          
      - name: Setup Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" --sdk_root=${ANDROID_SDK_ROOT}
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          
      - name: Compile KPM Directly
        run: |
          CC=${ANDROID_HOME}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          CFLAGS="-fno-builtin -fno-stack-protector -fno-common -nostdlib -fPIC -shared"
          INCS="-I KernelPatch/kernel/include -I KernelPatch/kernel/patch/include -I KernelPatch/kernel/linux/include -I KernelPatch/kernel/linux/arch/arm64/include"
          $CC $CFLAGS $INCS -o kpm/rt_kpm.kpm kpm/rt_kpm.c
          
      - name: Compile Daemon
        run: |
          CC=${ANDROID_HOME}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          $CC -O2 -static -pthread -o daemon/nyxd daemon/nyxd.c
          
      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt_kpm_driver
          path: kpm/rt_kpm.kpm
          
      - name: Upload Daemon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxd_bin
          path: daemon/nyxd
