name: Build KPM & Daemon
on: [push, workflow_dispatch]

jobs:
  build-all:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Pure KPM & Daemon Source
        run: |
          mkdir -p kpm daemon
          cat << 'INNER_EOF' > kpm/rt_kpm.c
          #include <linux/module.h>
          #include <linux/fs.h>
          #include <linux/uaccess.h>
          #include <linux/miscdevice.h>

          #define kp_get_symbol(name, _) __kp_get_symbol(name)
          extern void *__kp_get_symbol(const char *name);
          extern int __kp_mod_init(void);
          extern void __kp_mod_exit(void);

          #define KPM_NAME(x) const char __kpm_name[] __attribute__((section(".kpm.name"))) = x;
          #define KPM_VERSION(x) const char __kpm_version[] __attribute__((section(".kpm.version"))) = x;
          #define KPM_LICENSE(x) const char __kpm_license[] __attribute__((section(".kpm.license"))) = x;
          #define KPM_AUTHOR(x) const char __kpm_author[] __attribute__((section(".kpm.author"))) = x;
          #define KPM_DESCRIPTION(x) const char __kpm_description[] __attribute__((section(".kpm.description"))) = x;

          KPM_NAME("rt_kpm");
          KPM_VERSION("1.0");
          KPM_LICENSE("GPL");
          KPM_AUTHOR("sifu-web");
          KPM_DESCRIPTION("Hardware Level AC Bypass Driver");

          #define DEVICE_NAME "rt_kpm"
          #define RT_MAGIC    'R'

          struct rw_req { pid_t pid; uintptr_t addr; void *buf; size_t size; };
          #define IOCTL_READ  _IOWR(RT_MAGIC, 1, struct rw_req)
          #define IOCTL_WRITE _IOWR(RT_MAGIC, 2, struct rw_req)

          static int (*apv_fn)(struct task_struct *, unsigned long, void *, int, unsigned int);
          static struct pid *(*find_pid_fn)(int);
          static struct task_struct *(*get_pid_task_fn)(struct pid *, int);
          static void (*put_pid_fn)(struct pid *);
          static struct mm_struct *(*get_mm_fn)(struct task_struct *);
          static void (*put_mm_fn)(struct mm_struct *);
          static void (*put_task_fn)(struct task_struct *);
          static void *(*kzalloc_fn)(size_t, gfp_t);
          static void (*kfree_fn)(const void *);

          static long rt_ioctl(struct file *file, unsigned int cmd, unsigned long arg) {
              struct rw_req req;
              if (copy_from_user(&req, (void __user *)arg, sizeof(req))) return -EFAULT;
              struct pid *pid_struct = find_pid_fn(req.pid);
              if (!pid_struct) return -ESRCH;
              struct task_struct *task = get_pid_task_fn(pid_struct, 0);
              put_pid_fn(pid_struct);
              if (!task) return -ESRCH;
              struct mm_struct *mm = get_mm_fn(task);
              if (!mm) { put_task_fn(task); return -EINVAL; }
              void *kern_buf = kzalloc_fn(req.size, 0xCC0); // GFP_KERNEL
              if (!kern_buf) { put_mm_fn(mm); put_task_fn(task); return -ENOMEM; }

              if (cmd == IOCTL_READ) {
                  if (apv_fn(task, req.addr, kern_buf, req.size, 0) == req.size) copy_to_user(req.buf, kern_buf, req.size);
                  else req.size = 0;
              } else if (cmd == IOCTL_WRITE) {
                  if (copy_from_user(kern_buf, req.buf, req.size) == 0) apv_fn(task, req.addr, kern_buf, req.size, 1);
                  else req.size = 0;
              }
              kfree_fn(kern_buf); put_mm_fn(mm); put_task_fn(task);
              copy_to_user((void __user *)arg, &req, sizeof(req));
              return 0;
          }

          static const struct file_operations rt_fops = { 
              .owner = 0, 
              .unlocked_ioctl = rt_ioctl 
          };
          
          static struct miscdevice rt_misc = { 
              .minor = 255, // MISC_DYNAMIC_MINOR
              .name = DEVICE_NAME, 
              .fops = &rt_fops, 
              .mode = 0666 
          };

          int __init kpm_init(void) {
              apv_fn = kp_get_symbol("access_process_vm", 0);
              find_pid_fn = kp_get_symbol("find_get_pid", 0);
              get_pid_task_fn = kp_get_symbol("get_pid_task", 0);
              put_pid_fn = kp_get_symbol("put_pid", 0);
              get_mm_fn = kp_get_symbol("get_task_mm", 0);
              put_mm_fn = kp_get_symbol("mmput", 0);
              put_task_fn = kp_get_symbol("put_task_struct", 0);
              kzalloc_fn = kp_get_symbol("kzalloc", 0);
              kfree_fn = kp_get_symbol("kfree", 0);
              int (*misc_reg)(struct miscdevice *) = kp_get_symbol("misc_register", 0);
              if (!apv_fn || !misc_reg) return -1;
              misc_reg(&rt_misc);
              return 0;
          }

          void __exit kpm_exit(void) {
              void (*misc_dereg)(struct miscdevice *) = kp_get_symbol("misc_deregister", 0);
              if (misc_dereg) misc_dereg(&rt_misc);
          }
          INNER_EOF

          cat << 'INNER_EOF' > daemon/nyxd.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <sys/stat.h>
          #include <sys/ioctl.h>
          #include <pthread.h>
          #include <stdint.h>
          #include <errno.h>

          #define SOCK_PATH  "/data/adb/nyx/nyx.sock"
          #define ALLOW_PATH "/data/adb/nyx/allow"
          #define DEV_PATH   "/dev/rt_kpm"
          #define RT_MAGIC   'R'

          struct rw_req { pid_t pid; uintptr_t addr; void *buf; size_t size; };
          #define IOCTL_READ  _IOWR(RT_MAGIC, 1, struct rw_req)
          #define IOCTL_WRITE _IOWR(RT_MAGIC, 2, struct rw_req)

          typedef struct { uint32_t op, pad; uint64_t addr, buf, size; } req_t;
          static int g_fd = -1;

          static int is_allowed(uid_t uid) {
              FILE *f = fopen(ALLOW_PATH, "r"); if (!f) return 0;
              char line[64]; int ok = 0;
              while (fgets(line, sizeof(line), f)) if ((uid_t)atoi(line) == uid) { ok = 1; break; }
              fclose(f); return ok;
          }

          static void *conn_thread(void *arg) {
              int c = (int)(intptr_t)arg;
              struct ucred cred; socklen_t cl = sizeof(cred);
              uid_t uid = (uid_t)-1;
              if (getsockopt(c, SOL_SOCKET, SO_PEERCRED, &cred, &cl) == 0) uid = cred.uid;
              if (!is_allowed(uid)) { req_t deny = {0xFFFFFFFF, 0, 0, 0, 0}; write(c, &deny, sizeof(deny)); close(c); return NULL; }
              
              static __thread uint8_t tls_buf[1 << 20];
              for (;;) {
                  req_t r; if (read(c, &r, sizeof(r)) <= 0) break;
                  pid_t pid = (pid_t)(r.size >> 32); size_t size = (size_t)(uint32_t)r.size;
                  if (size > sizeof(tls_buf)) size = sizeof(tls_buf);
                  struct rw_req ireq = { .pid = pid, .addr = r.addr, .buf = tls_buf, .size = size };

                  if (r.op == 0) {
                      if (ioctl(g_fd, IOCTL_READ, &ireq) < 0) ireq.size = 0;
                      r.addr = ireq.size; 
                      if (write(c, &r, sizeof(r)) != sizeof(r)) break;
                      if (ireq.size > 0 && write(c, tls_buf, ireq.size) != ireq.size) break;
                  } else if (r.op == 1) {
                      if (read(c, tls_buf, size) != (ssize_t)size) break;
                      if (ioctl(g_fd, IOCTL_WRITE, &ireq) < 0) ireq.size = 0;
                      r.addr = ireq.size; 
                      if (write(c, &r, sizeof(r)) != sizeof(r)) break;
                  }
              }
              close(c); return NULL;
          }

          int main(void) {
              mkdir("/data/adb/nyx", 0700);
              g_fd = open(DEV_PATH, O_RDWR); if (g_fd < 0) return 1;
              unlink(SOCK_PATH);
              int s = socket(AF_UNIX, SOCK_STREAM, 0);
              struct sockaddr_un a = { .sun_family = AF_UNIX };
              strncpy(a.sun_path, SOCK_PATH, sizeof(a.sun_path) - 1);
              bind(s, (void *)&a, sizeof(a)); chmod(SOCK_PATH, 0666); listen(s, 16);
              for (;;) { int c = accept(s, NULL, NULL); pthread_t t; pthread_create(&t, NULL, conn_thread, (void *)(intptr_t)c); pthread_detach(t); }
          }
          INNER_EOF

      - name: Clone KPM-Spore
        run: |
          git clone https://github.com/jiqiu2022/kpm-spore.git
          
      - name: Setup Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" --sdk_root=${ANDROID_SDK_ROOT}
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          
      - name: Compile KPM
        run: |
          cp kpm/rt_kpm.c kpm-spore/modules/hello/module.c
          cd kpm-spore
          export NDK_PATH=${ANDROID_HOME}/ndk/26.1.10909125
          ./build.sh
          cp build/hello/hello.kpm ../kpm/rt_kpm.kpm
          
      - name: Compile Daemon
        run: |
          CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          $CC -O2 -static -pthread -o daemon/nyxd daemon/nyxd.c
          
      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt_kpm_driver
          path: kpm/rt_kpm.kpm
          
      - name: Upload Daemon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxd_bin
          path: daemon/nyxd
