name: Build KPM & Daemon
on: [push, workflow_dispatch]

jobs:
  build-all:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone KPM-Spore
        run: |
          git clone https://github.com/jiqiu2022/kpm-spore.git
          
      - name: Setup Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" --sdk_root=${ANDROID_SDK_ROOT}
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV
          
      - name: Compile KPM (Using kpm-spore)
        run: |
          cp kpm/rt_kpm.c kpm-spore/modules/hello/module.c
          cd kpm-spore
          export NDK_PATH=${ANDROID_HOME}/ndk/26.1.10909125
          ./build.sh
          cp build/hello/hello.kpm ../kpm/rt_kpm.kpm
          
      - name: Compile Daemon
        run: |
          CC=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          $CC -O2 -static -pthread -o daemon/nyxd daemon/nyxd.c
          
      - name: Upload KPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rt_kpm_driver
          path: kpm/rt_kpm.kpm
          
      - name: Upload Daemon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyxd_bin
          path: daemon/nyxd
